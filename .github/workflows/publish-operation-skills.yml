name: Publish operation skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/operation_skill_updater.py"
      - "scripts/build-operation-skill-release.py"
      - "scripts/publish-operation-skill-release.py"
      - "scripts/install-operation-skill-updater.ps1"
      - "scripts/install-operation-skill-updater.sh"
      - ".github/requirements/publish.txt"
      - ".github/workflows/publish-operation-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-operation-skills-main
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run updater and release tests
        run: python -m unittest discover -s tests -p "test_operation_skill_*.py" -v
      - name: Validate macOS installer
        if: runner.os == 'macOS'
        run: bash -n scripts/install-operation-skill-updater.sh
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-operation-skill-updater.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List | Out-String | Write-Error
          }

  skill-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/facebook-followed-video-download/scripts/package-lock.json
      - name: Install Python skill dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r skills/cloudflare-r2-video-upload/scripts/requirements.txt
          -r skills/philippines-lottery-result-media/scripts/requirements.txt
      - name: Install downloader dependencies
        working-directory: skills/facebook-followed-video-download/scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test cloudflare-r2-video-upload
        run: python -m unittest discover -s skills/cloudflare-r2-video-upload/tests -p "test_*.py" -v
      - name: Test facebook-daily-like
        run: python -m unittest discover -s skills/facebook-daily-like/tests -p "test_*.py" -v
      - name: Test facebook-followed-video-download
        run: python -m unittest discover -s skills/facebook-followed-video-download/tests -p "test_*.py" -v
      - name: Test facebook-post-publish
        run: python -m unittest discover -s skills/facebook-post-publish/tests -p "test_*.py" -v
      - name: Test facebook-video-ingest
        run: python -m unittest discover -s skills/facebook-video-ingest/tests -p "test_*.py" -v
      - name: Test myt-cloud-phone-file-upload
        run: python -m unittest discover -s skills/myt-cloud-phone-file-upload/tests -p "test_*.py" -v
      - name: Test philippines-lottery-result-media
        run: python -m unittest discover -s skills/philippines-lottery-result-media/tests -p "test_*.py" -v
      - name: Test downloader selection logic
        run: node --test skills/facebook-followed-video-download/tests/test_selection.js

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, skill-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build deterministic release
        env:
          OPERATION_SKILL_PUBLIC_BASE_URL: ${{ secrets.OPERATION_SKILL_PUBLIC_BASE_URL }}
        run: |
          test -n "$OPERATION_SKILL_PUBLIC_BASE_URL"
          python scripts/build-operation-skill-release.py \
            --output-dir dist/operation-skills \
            --public-base-url "${OPERATION_SKILL_PUBLIC_BASE_URL%/}/operation-skills" \
            --commit "$GITHUB_SHA" \
            --release-sequence "$GITHUB_RUN_ID"
      - name: Install hash-locked R2 client
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r .github/requirements/publish.txt
      - name: Verify release artifacts before credential injection
        run: >-
          python scripts/publish-operation-skill-release.py
          --dist dist/operation-skills --verify-only
      - name: Publish to Cloudflare R2
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: python scripts/publish-operation-skill-release.py --dist dist/operation-skills
