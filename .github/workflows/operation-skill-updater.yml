name: Operation skill updater

on:
  push:
    paths:
      - "scripts/build-operation-skill-release.py"
      - "scripts/operation_skill_updater.py"
      - "scripts/publish-operation-skill-release.py"
      - "scripts/install-operation-skill-updater.ps1"
      - "scripts/install-operation-skill-updater.sh"
      - "tests/test_operation_skill_*.py"
      - "tests/windows_operation_skill_smoke.py"
      - "scripts/test-windows-skill-updater.ps1"
      - ".github/workflows/operation-skill-updater.yml"
      - ".github/workflows/publish-operation-skills.yml"
  pull_request:
    paths:
      - "scripts/build-operation-skill-release.py"
      - "scripts/operation_skill_updater.py"
      - "scripts/publish-operation-skill-release.py"
      - "scripts/install-operation-skill-updater.ps1"
      - "scripts/install-operation-skill-updater.sh"
      - "tests/test_operation_skill_*.py"
      - "tests/windows_operation_skill_smoke.py"
      - "scripts/test-windows-skill-updater.ps1"
      - ".github/workflows/operation-skill-updater.yml"
      - ".github/workflows/publish-operation-skills.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run updater tests
        run: python -m unittest discover -s tests -p "test_operation_skill_*.py" -v
      - name: Validate macOS installer
        if: runner.os == 'macOS'
        run: bash -n scripts/install-operation-skill-updater.sh
      - name: Validate Windows PowerShell 5.1 installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-operation-skill-updater.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List | Out-String | Write-Error
          }
      - name: Exercise Windows installer as a standard user
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-skill-updater.ps1 -Python (Get-Command python.exe).Source
